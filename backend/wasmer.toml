# Wasmer Edge manifest — format verified against the official
# wasmer-examples PHP starters (wordpress/php-wcgi).
#
# Notes:
#  - No package name/version here. app.yaml uses `package: .` and Wasmer
#    derives the package name from the app owner + app name.
#  - Capabilities (instaboot, database, volumes) belong in app.yaml, NOT here.
[package]
entrypoint = "run"

[dependencies]
"php/php" = "=8.3.4"

# app/    -> /app     (document root + router script)
# config/ -> /config  (php.ini via PHPRC)
# sql/    -> /sql
[fs]
"/app" = "app"
"/config" = "config"
"/sql" = "sql"

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
# Equivalent to:
#   php -t /app -S localhost:8080 -d ... /app/index.php
# /app/index.php is the ROUTER script, so every /api/* request reaches our API.
main-args = [
  "-t", "/app",
  "-S", "localhost:8080",
  "-d", "upload_max_filesize=100M",
  "-d", "post_max_size=300M",
  "-d", "memory_limit=512M",
  "-d", "max_execution_time=60",
  "/app/index.php",
]
env = ["PHPRC=/config/", "DB_PATH=/tmp/parimatch_app.db", "UPLOAD_DIR=/tmp/parimatch_uploads"]

[package]
name = "vakki-8740/parimatch-backend"
version = "0.2.0"
description = "Parimatch Support Center — PHP Backend for Wasmer Edge"
license = "MIT"

[dependencies]
"php/php" = "=8.3.4"

[fs]
"/app" = "app"
"/app/config" = "config"
"/app/sql" = "sql"

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
main-args = ["-t", "/app", "-S", "0.0.0.0:8080", "-d", "upload_max_filesize=100M", "-d", "post_max_size=300M", "-d", "memory_limit=512M", "index.php"]
env = ["PHPRC=/app/config", "DB_PATH=/tmp/parimatch_app.db"]

# Capabilities for production
[capabilities]
[capabilities.net]
allow = ["0.0.0.0:8080"]

# Pre-warm routes for faster cold start
[capabilities.instaboot]
requests = [
  { path = "/" },
  { path = "/api/health" },
  { path = "/api/complains" },
]

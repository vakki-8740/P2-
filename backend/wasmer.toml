[package]
name = "vakki-8740/parimatch-backend"
version = "1.1.0"
description = "Parimatch Support Center — PHP + SQL backend for Wasmer Edge"
license = "MIT"

[dependencies]
"php/php" = "=8.3.4"

# Documented Wasmer layout: app/ at /app, config/ at /config, sql/ at /sql.
[fs]
"/app" = "app"
"/config" = "config"
"/sql" = "sql"

[[command]]
name = "run"
module = "php/php:php"
runner = "wasi"

[command.annotations.wasi]
# Equivalent to: php -t /app -S 0.0.0.0:8080 /app/index.php
main-args = [
  "-S", "0.0.0.0:8080",
  "-t", "/app",
  "-d", "upload_max_filesize=100M",
  "-d", "post_max_size=300M",
  "-d", "memory_limit=512M",
  "-d", "max_execution_time=60",
  "/app/index.php",
]
# PHPRC points at the mounted config dir -> /config/php.ini
env = ["PHPRC=/config/", "DB_PATH=/tmp/parimatch_app.db", "UPLOAD_DIR=/tmp/parimatch_uploads"]

[capabilities]
[capabilities.net]
allow = ["0.0.0.0:8080"]

# Pre-warm routes for faster cold start
[capabilities.instaboot]
requests = [
  { path = "/api/health" },
  { path = "/" },
]

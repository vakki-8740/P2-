; PHP config for Parimatch Backend — Wasmer Edge
; Maps to PHPRC=/app/config in wasmer.toml

opcache.validate_timestamps = 0
opcache.file_update_protection = 0
opcache.max_file_size = 0

upload_max_filesize = 100M
post_max_size = 300M
memory_limit = 512M
max_execution_time = 60
max_input_time = 60
post_max_size = 300M

display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; For file uploads
file_uploads = On
max_file_uploads = 20

; Timezone
date.timezone = Asia/Kolkata

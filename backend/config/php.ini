; PHP config for Parimatch Backend — Wasmer Edge (PHPRC=/app/config)

opcache.validate_timestamps = 0
opcache.file_update_protection = 0
opcache.max_file_size = 0

; Uploads: 100 MB per file, 300 MB per request (matches the frontend limits)
upload_max_filesize = 100M
post_max_size = 300M
memory_limit = 512M
max_execution_time = 60
max_input_time = 60

display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Uploads
file_uploads = On
max_file_uploads = 20

; JSON bodies are read from php://input, keep POST parsing lean
enable_post_data_reading = On

; Timezone
date.timezone = Asia/Kolkata

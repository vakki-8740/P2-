kind: wasmer.io/App.v0
name: parimatch-backend
owner: vakki-8740

# "." = build/deploy the local package described by wasmer.toml
# (the old `package: {name, version}` form is deprecated).
package: .

scaling:
  mode: single_concurrency

# Persistent disk (Wasmer Edge Volumes). Without this, the SQLite file and the
# uploaded files live in /tmp and are wiped on every redeploy/restart.
# Remove this block (and restore the /tmp paths below) to go back to ephemeral.
volumes:
  - name: data
    mount: /data

# Non-secret defaults only. Database credentials, APP_KEY and ADMIN_API_TOKEN
# must be created as secrets so they never live in the repo:
#   wasmer secret create DB_HOST --value=...
#   wasmer secret create DB_NAME --value=...
#   wasmer secret create DB_USER --value=...
#   wasmer secret create DB_PASS --value=...
#   wasmer secret create APP_KEY  --value=$(openssl rand -hex 32)
#   wasmer secret create ADMIN_API_TOKEN --value=$(openssl rand -hex 24)
env:
  DB_PORT: "3306"
  DB_PATH: "/data/app.db"
  UPLOAD_DIR: "/data/uploads"
  MAX_UPLOAD_MB: "100"
  MAX_REQUEST_MB: "300"
  CORS_ORIGINS: "*"

capabilities:
  instaboot:
    requests:
      - path: /api/health

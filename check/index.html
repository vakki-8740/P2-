<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live check — Firebase</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;background:#f3f5f9;color:#111}
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  h1{font-size:18px;margin:0 0 4px}
  p.sub{margin:0 0 14px;color:#666;font-size:13.5px}
  .box{background:#fff;border:1px solid #dde2ec;border-radius:12px;padding:14px;margin-bottom:12px}
  label{display:block;font-size:12.5px;color:#555;margin:10px 0 5px}
  textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd3e0;border-radius:9px;font:12.5px/1.5 ui-monospace,Menlo,monospace;min-height:150px}
  input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd3e0;border-radius:9px;font-size:14px}
  button{padding:11px 16px;border:0;border-radius:9px;background:#2563eb;color:#fff;font-size:14px;font-weight:600;margin-top:12px;cursor:pointer}
  button:disabled{opacity:.6}
  button.grey{background:#e7ebf3;color:#111;font-weight:500}
  #status{margin-top:12px;font-size:14px;line-height:1.5}
  .ok{color:#0a7d43}.bad{color:#c62828}.warn{color:#a15c00}
  .live{display:inline-block;background:#0a7d43;color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;letter-spacing:.4px}
  .live::before{content:"●";margin-right:6px;animation:blink 1.4s infinite}
  @keyframes blink{50%{opacity:.25}}
  .big{font-size:34px;font-weight:700;margin:4px 0}
  ul{padding-left:18px;margin:8px 0;font-size:14px}
  li{margin:5px 0}
  pre{background:#0d1117;color:#d7e2f0;padding:12px;border-radius:9px;overflow:auto;max-height:320px;font-size:12px;line-height:1.5}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .muted{color:#777;font-size:12.5px}
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <h1>Live data check</h1>
  <p class="sub">Firebase Realtime Database se seedha — koi refresh nahi, data aate hi screen pe.</p>

  <!-- ---------- setup ---------- -->
  <section class="box" id="setup">
    <label>firebaseConfig paste karo (Firebase console → Project settings → Your apps → Config)</label>
    <textarea id="cfg" placeholder='const firebaseConfig = {
  apiKey: "AIza...",
  authDomain: "your-project.firebaseapp.com",
  databaseURL: "https://your-project-default-rtdb.firebaseio.com",
  projectId: "your-project",
  storageBucket: "your-project.appspot.com",
  messagingSenderId: "1234567890",
  appId: "1:1234:web:abcd"
};'></textarea>
    <div class="row">
      <button id="connect">Connect</button>
    </div>
    <div id="status"></div>
  </section>

  <!-- ---------- live ---------- -->
  <section class="box hidden" id="panel">
    <div class="row" style="justify-content:space-between">
      <span class="live">LIVE</span>
      <span class="muted" id="updated">—</span>
    </div>

    <div class="muted" style="margin-top:12px">Total complaints</div>
    <div class="big" id="count">0</div>

    <div id="names"></div>

    <details style="margin-top:12px">
      <summary class="muted" style="cursor:pointer">Raw JSON dekho</summary>
      <pre id="raw"></pre>
    </details>

    <div class="row">
      <button id="sample" class="grey">Test complaint bhejo</button>
      <button id="disconnect" class="grey">Disconnect</button>
    </div>
    <div id="status2" class="muted" style="margin-top:10px"></div>
  </section>
</div>

<!-- Firebase compat SDK (CDN) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var LS_CFG = 'check_fb_config';
  var ROOT = 'parimatch';

  var app = null;
  var unsubscribe = null;
  var lastData = [];

  function say(text, cls, el) {
    var node = $(el || 'status');
    node.textContent = text || '';
    node.className = cls || '';
  }

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /** firebaseConfig text se values nikaalo (paste ki hui string se). */
  function parseConfig(text) {
    function pick(key) {
      var re = new RegExp(key + '\\s*:\\s*["\']([^"\']+)["\']');
      var m = String(text || '').match(re);
      return m ? m[1] : '';
    }
    return {
      apiKey: pick('apiKey'),
      authDomain: pick('authDomain'),
      databaseURL: pick('databaseURL'),
      projectId: pick('projectId'),
      storageBucket: pick('storageBucket'),
      messagingSenderId: pick('messagingSenderId'),
      appId: pick('appId'),
    };
  }

  /** parimatch/complaints/{client}/{id} → flat array */
  function flatten(val) {
    var out = [];
    if (!val || typeof val !== 'object') return out;
    Object.keys(val).forEach(function (client) {
      var bucket = val[client];
      if (!bucket || typeof bucket !== 'object') return;
      Object.keys(bucket).forEach(function (id) {
        var row = bucket[id] || {};
        out.push({
          id: String(row.id || id),
          client: String(client).slice(0, 8),
          type: row.type || 'complain',
          title: row.title || '',
          status: row.status || 'pending',
          createdAt: row.createdAt || '',
          details: row.details || {},
          files: row.files || {},
        });
      });
    });
    out.sort(function (a, b) { return String(b.createdAt).localeCompare(String(a.createdAt)); });
    return out;
  }

  function render(items) {
    lastData = items;
    $('count').textContent = items.length;
    $('raw').textContent = JSON.stringify(items, null, 2);
    $('updated').textContent = 'Last update: ' + new Date().toLocaleTimeString('en-IN');

    if (!items.length) {
      $('names').innerHTML = '<div class="muted">Abhi koi complaint nahi hai — website se ek bhejo, turant yahan dikhegi.</div>';
      return;
    }
    $('names').innerHTML = '<ul>' + items.slice(0, 25).map(function (c) {
      var d = c.details || {};
      var who = d.userName || d.user_name || '(no name)';
      return '<li><b>' + esc(c.type) + '</b> — ' + esc(who) +
        (d.mobile ? ' — ' + esc(d.mobile) : '') +
        ' <span class="muted">' + esc(String(c.createdAt).slice(0, 16).replace('T', ' ')) +
        ' · client ' + esc(c.client) + '</span></li>';
    }).join('') + '</ul>' +
      (items.length > 25 ? '<div class="muted">… aur ' + (items.length - 25) + ' zyada</div>' : '');
  }

  function connect() {
    var text = $('cfg').value.trim();
    if (!text) { say('Pehle firebaseConfig paste karo.', 'bad'); return; }

    var cfg = parseConfig(text);
    if (!cfg.databaseURL) {
      say('config me "databaseURL" nahi mila — Realtime Database banao, phir config dobara copy karo.', 'bad');
      return;
    }
    if (typeof firebase === 'undefined' || !firebase.initializeApp) {
      say('Firebase SDK load nahi hua (internet/CDN block). Page reload karke dobara try karo.', 'bad');
      return;
    }

    try {
      if (app) { try { app.delete(); } catch (e) {} }
      app = firebase.initializeApp(cfg, 'check-' + Date.now());
    } catch (err) {
      say('Firebase init fail: ' + (err.message || err), 'bad');
      return;
    }

    try { localStorage.setItem(LS_CFG, text); } catch (e) {}
    say('Connect ho raha hai…', 'warn');

    var db = app.database();
    var ref = db.ref(ROOT + '/complaints');

    if (unsubscribe) { try { unsubscribe(); } catch (e) {} }
    unsubscribe = ref.on('value', function (snap) {
      $('setup').classList.add('hidden');
      $('panel').classList.remove('hidden');
      say('', 'ok');
      render(flatten(snap.val()));
    }, function (err) {
      say('Read fail: ' + (err.message || err) + ' — Realtime DB rules "test mode" me hone chahiye.', 'bad');
    });
  }

  function disconnect() {
    if (unsubscribe) { try { unsubscribe(); } catch (e) {} unsubscribe = null; }
    if (app) { try { app.delete(); } catch (e) {} app = null; }
    $('setup').classList.remove('hidden');
    $('panel').classList.add('hidden');
    say('Disconnected.', 'muted');
  }

  /** Is page se ek test complaint likho (write path check). */
  function sendSample() {
    if (!app) { say('Pehle connect karo.', 'bad', 'status2'); return; }
    var db = app.database();
    var client = 'check-page';
    var id = 'chk_' + Date.now();
    var now = new Date().toISOString();

    db.ref(ROOT + '/complaints/' + client + '/' + id).set({
      id: id,
      type: 'deposit',
      title: 'Test complaint (check page)',
      status: 'pending',
      createdAt: now,
      updatedAt: now,
      details: {
        userName: 'Test User',
        mobile: '9999999999',
        email: 'test@example.com',
        amount: '100',
        message: 'Check page se bheji gayi ' + now,
      },
      hasPassword: false,
      files: {},
    }).then(function () {
      say('✅ Bhej di — list me turant dikhni chahiye (refresh ke bina).', 'ok', 'status2');
    }).catch(function (err) {
      say('❌ Write fail: ' + (err.message || err), 'bad', 'status2');
    });
  }

  $('connect').addEventListener('click', connect);
  $('disconnect').addEventListener('click', disconnect);
  $('sample').addEventListener('click', sendSample);

  try {
    var saved = localStorage.getItem(LS_CFG);
    if (saved) { $('cfg').value = saved; connect(); }
  } catch (e) {}

  // test hook
  window.__check = { connect: connect, render: render, parseConfig: parseConfig, flatten: flatten };
})();
</script>
</body>
</html>
